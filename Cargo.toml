[package]
name = "brokr"
version = "0.1.4"
edition = "2021"
rust-version = "1.89"
authors = ["brokr contributors"]
description = "AI-safe credential broker CLI"
license = "MIT"
repository = "https://github.com/Furowu/brokr"
keywords = ["cli", "security", "credentials", "ssh", "ai"]
categories = ["command-line-utilities", "authentication"]

[features]
default = ["in_proc_inject"]
# In-process PTY password injection (used by integration tests; optional for strict builds).
in_proc_inject = []

[dependencies]
clap = { version = "4.5", features = ["derive", "string"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
aes-gcm = "0.10"
argon2 = "0.5"
sha2 = "0.10"
hmac = "0.12"
rand = "0.8"
zeroize = { version = "1.7", features = ["derive"] }
keyring = "2.3"
is-terminal = "0.4"
rpassword = "7.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "1"
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
which = "6"
fs4 = "0.12"
base64ct = "1.6"
hex = "0.4"
regex = "1"
portable-pty = "0.8"
crossterm = "0.27"
signal-hook = { version = "0.3", features = ["iterator"] }
tiny_http = "0.12"

rmcp = { version = "1.7", features = ["server", "macros", "transport-io"] }
schemars = "0.8"
tokio = { version = "1", features = ["rt", "macros", "process", "io-std"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
nix = { version = "0.29", features = ["process", "signal", "term", "fs"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
serial_test = "3"
tempfile = "3.10"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"

[profile.release-opt]
inherits = "release"
opt-level = 3
